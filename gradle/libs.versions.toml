[versions]
assertj = "3.27.7"
awsCdkLib = "2.237.0"
awsCdkConstructs = "10.4.5"
awsSdk = "2.41.24"
errorprone-core = "2.47.0"
errorprone-plugin = "5.0.0"
jspecify = "1.0.0"
junitJupiter = "6.0.2"
nullaway = "0.13.1"
nullaway-plugin = "3.0.0"
